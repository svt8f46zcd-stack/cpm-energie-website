name: Deploy CPM Energie to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build static site
        run: |
          set -e
          rm -rf out
          npm run build

          test -s out/index.html

          # GitHub Pages project sites can resolve both /route and /route/.
          # Publish both forms so direct navigation never depends on a redirect.
          for dir in out/*/; do
            route="${dir%/}"
            name="$(basename "$route")"
            if [ -f "$route/index.html" ] && [ "$name" != "_next" ]; then
              cp "$route/index.html" "out/$name.html"
            fi
          done

          # Keep a root fallback for unknown/deep requests.
          cp out/index.html out/404.html
          touch out/.nojekyll

          test -s out/index.html
          test -s out/404.html
          test -f out/ersparnisrechner/index.html
          test -f out/ersparnisrechner.html
          test -f out/kontakt/index.html
          test -f out/kontakt.html
          test -f out/kontakt/rechnung/index.html
          test -f out/impressum/index.html
          test -f out/impressum.html
          test -f out/datenschutz/index.html
          test -f out/datenschutz.html
          test -f out/so-funktionierts/index.html
          test -f out/so-funktionierts.html
          test -f out/ueber-mich/index.html
          test -f out/ueber-mich.html

          echo "GitHub Pages artifact verified: $(find out -type f | wc -l) files"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
