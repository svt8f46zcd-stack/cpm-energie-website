name: Deploy CPM Energie to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build static site
        run: |
          set -e
          rm -rf out
          npm run build

          # GitHub Pages project-site fallback: always publish a real root
          # index and a homepage fallback for direct/deep URL requests.
          test -s out/index.html
          cp out/index.html out/404.html
          test -s out/index.html
          test -s out/404.html
          test -f out/.nojekyll || touch out/.nojekyll

          test -f out/ersparnisrechner/index.html
          test -f out/kontakt/index.html
          test -f out/kontakt/rechnung/index.html
          test -f out/impressum/index.html
          test -f out/datenschutz/index.html
          test -f out/so-funktionierts/index.html
          test -f out/ueber-mich/index.html

          echo "GitHub Pages artifact verified: $(find out -type f | wc -l) files"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
