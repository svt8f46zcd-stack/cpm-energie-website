name: Deploy CPM Energie to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Enable precision invoice recognition
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path("components/BillUpload.tsx")
          s = p.read_text()
          old = 'from "@/lib/bill-analysis-enhanced"'
          new = 'from "@/lib/bill-analysis-precision"'
          if old not in s:
              raise SystemExit("Expected BillUpload analyzer import was not found")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build static site
        run: |
          set -e
          npm run build
          test -f out/index.html
          test -f out/404.html
          test -f out/ersparnisrechner/index.html
          test -f out/kontakt/index.html
          test -f out/kontakt/rechnung/index.html
          test -f out/impressum/index.html
          test -f out/datenschutz/index.html
          test -f out/so-funktionierts/index.html
          test -f out/ueber-mich/index.html
          touch out/.nojekyll
          echo "Static export verified: $(find out -type f | wc -l) files"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
