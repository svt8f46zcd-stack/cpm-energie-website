name: Deploy CPM Energie to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_BASE: https://svt8f46zcd-stack.github.io/cpm-energie-website
  SITE_URLS: |
    https://svt8f46zcd-stack.github.io/cpm-energie-website/
    https://svt8f46zcd-stack.github.io/cpm-energie-website/?utm_source=chatgpt.com
    https://svt8f46zcd-stack.github.io/cpm-energie-website/kontakt/
    https://svt8f46zcd-stack.github.io/cpm-energie-website/ersparnisrechner/
    https://svt8f46zcd-stack.github.io/cpm-energie-website/so-funktionierts/
    https://svt8f46zcd-stack.github.io/cpm-energie-website/ueber-mich/
    https://svt8f46zcd-stack.github.io/cpm-energie-website/impressum/
    https://svt8f46zcd-stack.github.io/cpm-energie-website/datenschutz/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build project site and audit every route and asset
        run: |
          set -euo pipefail
          rm -rf out
          npm run build

          test -s out/index.html
          test -d out/_next
          test -s out/logo-cpm-energie.svg
          test -s out/cristiano.svg
          test -s out/sitemap.xml
          test -s out/robots.txt

          for route in \
            index.html \
            kontakt/index.html \
            ersparnisrechner/index.html \
            so-funktionierts/index.html \
            ueber-mich/index.html \
            impressum/index.html \
            datenschutz/index.html; do
            test -s "out/$route"
          done

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("out")
          html_files = sorted(root.rglob("*.html"))
          assert html_files, "No HTML files generated"

          bad = []
          refs = set()
          for path in html_files:
              text = path.read_text(encoding="utf-8")
              if 'href="/_next/' in text or 'src="/_next/' in text:
                  bad.append(f"root-relative Next asset path in {path}")
              if 'src="/logo-cpm-energie.svg' in text or 'src="/cristiano.svg' in text:
                  bad.append(f"root-relative public asset path in {path}")
              for value in re.findall(r'(?:href|src|action)=["\']([^"\']+)', text):
                  if value.startswith("/cpm-energie-website/"):
                      clean = value.split("?", 1)[0].split("#", 1)[0]
                      if clean.endswith("/"):
                          continue
                      refs.add(clean)

          for ref in sorted(refs):
              local = root / ref.lstrip("/")
              if not local.exists():
                  bad.append(f"missing generated asset: {ref}")

          if bad:
              print("\n".join(bad))
              raise SystemExit(1)

          print(f"HTML files audited: {len(html_files)}")
          print(f"Local project-site references audited: {len(refs)}")
          print("PROJECT SITE BUILD AUDIT PASSED")
          PY

          touch out/.nojekyll

          echo "===== COMPLETE PROJECT SITE TREE ====="
          find out -print | sort
          echo "===== ROUTE INDEX FILES ====="
          find out -type f -name index.html -print | sort

      - name: Diagnose current project-site deployment
        continue-on-error: true
        run: |
          set +e
          echo "===== PRE-DEPLOY PROJECT SITE DIAGNOSTIC ====="
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            cb="$(date +%s%N)-$RANDOM"
            case "$url" in
              *\?*) full_url="${url}&cb=${cb}" ;;
              *) full_url="${url}?cb=${cb}" ;;
            esac
            echo "--- URL=$full_url ---"
            curl -sS -I --max-time 30 \
              -H 'Cache-Control: no-cache' \
              "$full_url" 2>&1 | tr -d '\r' || true
            echo
          done <<< "$SITE_URLS"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify project site after deployment
        run: |
          set -euo pipefail
          echo "===== POST-DEPLOY PROJECT SITE CURL PROOF ====="
          failed=0

          for pass in 1 2 3; do
            echo "===== PASS $pass ====="
            while IFS= read -r url; do
              [ -z "$url" ] && continue
              cb="$(date +%s%N)-$RANDOM"
              case "$url" in
                *\?*) full_url="${url}&cb=${cb}" ;;
                *) full_url="${url}?cb=${cb}" ;;
              esac
              echo "--- URL=$full_url ---"
              headers="$(mktemp)"
              if ! curl -sS -I --max-time 30 \
                -H 'Cache-Control: no-cache' \
                "$full_url" >"$headers" 2>&1; then
                cat "$headers" | tr -d '\r'
                echo "RESULT=REQUEST_FAILED"
                failed=1
                rm -f "$headers"
                continue
              fi
              cat "$headers" | tr -d '\r'
              status="$(awk 'NR==1 {print $2}' "$headers")"
              echo "RESULT=HTTP_$status"
              if [ "$status" != "200" ]; then
                failed=1
              fi
              rm -f "$headers"
            done <<< "$SITE_URLS"
          done

          echo "===== VERIFY CRITICAL STATIC ASSETS FROM LIVE HTML ====="
          html="$(curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$SITE_BASE/?cb=$(date +%s%N)")"
          css_path="$(printf '%s' "$html" | sed -n 's/.*href="\([^\"]*\.css\)".*/\1/p' | head -1)"
          js_path="$(printf '%s' "$html" | sed -n 's/.*src="\([^\"]*\.js\)".*/\1/p' | head -1)"

          if [ -z "$css_path" ] || [ -z "$js_path" ]; then
            echo "Could not extract live CSS/JS references"
            failed=1
          else
            for path in "$css_path" "$js_path" "/cpm-energie-website/logo-cpm-energie.svg" "/cpm-energie-website/cristiano.svg" "/cpm-energie-website/robots.txt" "/cpm-energie-website/sitemap.xml"; do
              url="https://svt8f46zcd-stack.github.io${path}"
              echo "--- ASSET=$url ---"
              status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -H 'Cache-Control: no-cache' "$url?cb=$(date +%s%N)")"
              echo "RESULT=HTTP_$status"
              if [ "$status" != "200" ]; then
                echo "ASSET CHECK FAILED: $url"
                failed=1
              fi
            done
          fi

          if [ "$failed" -ne 0 ]; then
            echo "PROJECT SITE VERIFICATION FAILED"
            exit 1
          fi

          echo "PROJECT SITE VERIFICATION PASSED: all routes returned HTTP 200 in all 3 passes and live CSS/JS/public assets are reachable."
