name: Deploy CPM Energie to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_BASE: https://svt8f46zcd-stack.github.io/cpm-energie-website
  SITE_URLS: |
    https://svt8f46zcd-stack.github.io/cpm-energie-website/
    https://svt8f46zcd-stack.github.io/cpm-energie-website/?utm_source=chatgpt.com
    https://svt8f46zcd-stack.github.io/cpm-energie-website/kontakt/
    https://svt8f46zcd-stack.github.io/cpm-energie-website/ersparnisrechner/
    https://svt8f46zcd-stack.github.io/cpm-energie-website/so-funktionierts/
    https://svt8f46zcd-stack.github.io/cpm-energie-website/ueber-mich/
    https://svt8f46zcd-stack.github.io/cpm-energie-website/impressum/
    https://svt8f46zcd-stack.github.io/cpm-energie-website/datenschutz/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build and create project-site mirror
        run: |
          set -euo pipefail
          rm -rf out
          npm run build

          test -s out/index.html
          test -d out/_next
          test -s out/logo-cpm-energie.svg
          test -s out/cristiano.svg
          test -s out/sitemap.xml
          test -s out/robots.txt

          # Stable fallback: copy the exact compiled Tailwind stylesheet to a
          # predictable URL so the project site cannot render unstyled when a
          # hashed Next asset is stale or cached incorrectly.
          compiled_css="$(find out/_next/static/chunks -maxdepth 1 -type f -name '*.css' | sort | head -n 1)"
          test -n "$compiled_css"
          cp "$compiled_css" out/site.css
          test -s out/site.css

          project_site="$(mktemp -d)"
          cp -a out/. "$project_site/"
          mkdir -p out/cpm-energie-website
          cp -a "$project_site"/. out/cpm-energie-website/

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          prefix = "/cpm-energie-website"
          version = os.environ.get("GITHUB_SHA", "dev")[:12]
          root = Path("out/cpm-energie-website")
          fallback = f'<link rel="stylesheet" href="{prefix}/site.css?v={version}" data-cpm-fallback="true"/>'

          for path in root.rglob("*.html"):
              text = path.read_text(encoding="utf-8")
              for attr in ("href", "src", "srcSet", "poster", "action"):
                  text = re.sub(
                      rf'({attr}=["\'])/(?!/|cpm-energie-website)([^"\']*)',
                      rf'\1{prefix}/\2',
                      text,
                  )
              text = text.replace("url(/_next/", f"url({prefix}/_next/")
              if 'data-cpm-fallback="true"' not in text:
                  text = text.replace("</head>", fallback + "</head>", 1)
              path.write_text(text, encoding="utf-8")

          # Keep the root copy usable too. The project-site mirror remains the
          # only deployment URL asserted by the verification step.
          for path in Path("out").rglob("*.html"):
              if str(path).startswith("out/cpm-energie-website/"):
                  continue
              text = path.read_text(encoding="utf-8")
              if 'data-cpm-fallback="true"' not in text:
                  text = text.replace("</head>", fallback + "</head>", 1)
              path.write_text(text, encoding="utf-8")
          PY

          for route in \
            index.html \
            kontakt/index.html \
            ersparnisrechner/index.html \
            so-funktionierts/index.html \
            ueber-mich/index.html \
            impressum/index.html \
            datenschutz/index.html; do
            test -s "out/cpm-energie-website/$route"
          done
          test -d out/cpm-energie-website/_next
          test -s out/cpm-energie-website/site.css
          test -s out/cpm-energie-website/logo-cpm-energie.svg
          test -s out/cpm-energie-website/cristiano.svg
          test -s out/cpm-energie-website/robots.txt
          test -s out/cpm-energie-website/sitemap.xml

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("out/cpm-energie-website")
          bad = []
          refs = set()
          html_files = sorted(root.rglob("*.html"))
          for path in html_files:
              text = path.read_text(encoding="utf-8")
              if 'href="/_next/' in text or 'src="/_next/' in text:
                  bad.append(f"unprefixed Next asset in {path}")
              if 'src="/logo-cpm-energie.svg' in text or 'src="/cristiano.svg' in text:
                  bad.append(f"unprefixed public asset in {path}")
              for value in re.findall(r'(?:href|src|action)=["\']([^"\']+)', text):
                  if value.startswith("/cpm-energie-website/"):
                      clean = value.split("?", 1)[0].split("#", 1)[0]
                      if clean.endswith("/"):
                          continue
                      refs.add(clean)
          for ref in sorted(refs):
              local = Path("out") / ref.lstrip("/")
              if not local.exists():
                  bad.append(f"missing mirror asset: {ref}")
          if bad:
              print("\n".join(bad))
              raise SystemExit(1)
          print(f"Mirror HTML files audited: {len(html_files)}")
          print(f"Mirror local references audited: {len(refs)}")
          print("PROJECT SITE MIRROR BUILD AUDIT PASSED")
          PY

          touch out/.nojekyll
          touch out/cpm-energie-website/.nojekyll

          echo "===== PROJECT SITE MIRROR TREE ====="
          find out/cpm-energie-website -print | sort

      - name: Diagnose current project-site deployment
        continue-on-error: true
        run: |
          set +e
          echo "===== PRE-DEPLOY PROJECT SITE DIAGNOSTIC ====="
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            cb="$(date +%s%N)-$RANDOM"
            case "$url" in
              *\?*) full_url="${url}&cb=${cb}" ;;
              *) full_url="${url}?cb=${cb}" ;;
            esac
            echo "--- URL=$full_url ---"
            curl -sS -I --max-time 30 -H 'Cache-Control: no-cache' "$full_url" 2>&1 | tr -d '\r' || true
            echo
          done <<< "$SITE_URLS"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify project site after deployment
        run: |
          set -euo pipefail
          echo "===== POST-DEPLOY PROJECT SITE CURL PROOF ====="
          failed=0
          for pass in 1 2 3; do
            echo "===== PASS $pass ====="
            while IFS= read -r url; do
              [ -z "$url" ] && continue
              cb="$(date +%s%N)-$RANDOM"
              case "$url" in
                *\?*) full_url="${url}&cb=${cb}" ;;
                *) full_url="${url}?cb=${cb}" ;;
              esac
              echo "--- URL=$full_url ---"
              headers="$(mktemp)"
              if ! curl -sS -I --max-time 30 -H 'Cache-Control: no-cache' "$full_url" >"$headers" 2>&1; then
                cat "$headers" | tr -d '\r'
                echo "RESULT=REQUEST_FAILED"
                failed=1
                rm -f "$headers"
                continue
              fi
              cat "$headers" | tr -d '\r'
              status="$(awk 'NR==1 {print $2}' "$headers")"
              echo "RESULT=HTTP_$status"
              if [ "$status" != "200" ]; then failed=1; fi
              rm -f "$headers"
            done <<< "$SITE_URLS"
          done

          echo "===== VERIFY LIVE CSS, JS AND PUBLIC ASSETS ====="
          html="$(curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$SITE_BASE/?cb=$(date +%s%N)")"
          mapfile -t assets < <(printf '%s' "$html" | grep -oE '(/cpm-energie-website/[^" ]+\.(css|js|svg))' | sort -u)
          assets+=("/cpm-energie-website/site.css" "/cpm-energie-website/logo-cpm-energie.svg" "/cpm-energie-website/cristiano.svg" "/cpm-energie-website/robots.txt" "/cpm-energie-website/sitemap.xml")
          for path in "${assets[@]}"; do
            url="https://svt8f46zcd-stack.github.io${path}"
            status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -H 'Cache-Control: no-cache' "$url?cb=$(date +%s%N)")"
            echo "ASSET=$url RESULT=HTTP_$status"
            if [ "$status" != "200" ]; then failed=1; fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "PROJECT SITE VERIFICATION FAILED"
            exit 1
          fi
          echo "PROJECT SITE VERIFICATION PASSED"
