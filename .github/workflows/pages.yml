name: Deploy CPM Energie to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GITHUB_PAGES: "true"
  NEXT_PUBLIC_GITHUB_PAGES: "true"
  NEXT_PUBLIC_SPLINE_SCENE_URL: ${{ vars.CPM_SPLINE_SCENE_URL }}
  SITE_BASE: https://svt8f46zcd-stack.github.io/cpm-energie-website
  SITE_URLS: |
    https://svt8f46zcd-stack.github.io/cpm-energie-website/
    https://svt8f46zcd-stack.github.io/cpm-energie-website/kontakt/
    https://svt8f46zcd-stack.github.io/cpm-energie-website/ersparnisrechner/
    https://svt8f46zcd-stack.github.io/cpm-energie-website/so-funktionierts/
    https://svt8f46zcd-stack.github.io/cpm-energie-website/ueber-mich/
    https://svt8f46zcd-stack.github.io/cpm-energie-website/impressum/
    https://svt8f46zcd-stack.github.io/cpm-energie-website/datenschutz/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies and refresh lockfile
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize package lockfile"
          git push

      - name: Build GitHub Pages export
        run: |
          set -euo pipefail
          rm -rf out
          npm run build

          test -s out/index.html
          test -d out/_next
          test -s out/logo-cpm-energie.svg
          test -s out/robots.txt
          test -s out/sitemap.xml
          test -s out/.nojekyll

          for route in \
            index.html \
            kontakt/index.html \
            ersparnisrechner/index.html \
            so-funktionierts/index.html \
            ueber-mich/index.html \
            impressum/index.html \
            datenschutz/index.html; do
            test -s "out/$route"
          done

          grep -q 'noindex, nofollow' out/index.html
          grep -q 'Testversion' out/index.html
          grep -q 'Disallow: /' out/robots.txt

          if grep -q 'https://cpm-energie.de/sitemap.xml' out/robots.txt; then
            echo "GitHub Pages robots.txt must not advertise a sitemap"
            exit 1
          fi

          echo "===== STATIC EXPORT TREE ====="
          find out -maxdepth 3 -type f | sort
          echo "===== GITHUB PAGES EXPORT AUDIT PASSED ====="

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify project site
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            status="$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 30 -H 'Cache-Control: no-cache' "$url?cb=$(date +%s%N)")"
            echo "$url -> HTTP_$status"
            if [ "$status" != "200" ]; then failed=1; fi
          done <<< "$SITE_URLS"

          html="$(curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$SITE_BASE/?cb=$(date +%s%N)")"
          grep -q 'Testversion' <<< "$html"
          grep -q 'noindex, nofollow' <<< "$html"

          robots="$(curl -fsSL --max-time 30 "$SITE_BASE/robots.txt?cb=$(date +%s%N)")"
          grep -q 'Disallow: /' <<< "$robots"

          sitemap="$(curl -fsSL --max-time 30 "$SITE_BASE/sitemap.xml?cb=$(date +%s%N)")"
          if grep -q '<url>' <<< "$sitemap"; then
            echo "GitHub Pages sitemap must not contain URL entries"
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            echo "PROJECT SITE VERIFICATION FAILED"
            exit 1
          fi
          echo "PROJECT SITE VERIFICATION PASSED"
