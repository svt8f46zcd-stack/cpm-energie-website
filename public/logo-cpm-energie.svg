<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
<title id="title">CPM Energie</title>
<desc id="desc">CPM Energie Logo mit Claim Mehr Möglichkeiten für Morgen</desc>
<defs>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0aa7ff"/>
    <stop offset="1" stop-color="#19b7ff"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<!-- CPM monogram -->
<g fill="none" stroke="#fff" stroke-width="38" stroke-linecap="square" stroke-linejoin="round" filter="url(#glow)">
  <path d="M330 88H150C92 88 62 124 62 178v34c0 54 30 90 88 90h180"/>
  <path d="M390 302V88h205c52 0 82 30 82 76v5c0 47-30 76-82 76H390"/>
  <path d="M690 302V88l150 144L1010 88v214"/>
</g>
<!-- ENERGIE -->
<g fill="url(#blue)" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="800" letter-spacing="25">
  <text x="62" y="382">ENERGIE</text>
</g>
<!-- Claim -->
<text x="62" y="432" fill="#fff" opacity=".92" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" letter-spacing="12">MEHR MÖGLICHKEITEN FÜR MORGEN</text>
</svg>